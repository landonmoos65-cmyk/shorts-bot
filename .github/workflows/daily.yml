name: Daily Short

on:
  schedule:  # 2 Shorts a day (times in UTC = 12 PM and 7 PM US Eastern)
    - cron: "0 16 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:        # "Run workflow" button for manual tests

permissions:
  contents: write

concurrency:  # never run two at once (they'd fight over history.json)
  group: shorts-bot
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: video
          path: work/final.mp4
          if-no-files-found: ignore
      - name: Save history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json || exit 0
          git commit -m "history: $(date -u +%F)" || exit 0
          git pull --rebase -X theirs || true
          git push
