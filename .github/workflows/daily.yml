name: Daily Short

on:
  schedule:
    - cron: "0 17 * * *"   # every day 17:00 UTC (1 PM US Eastern)
  workflow_dispatch:        # "Run workflow" button for manual tests

permissions:
  contents: write

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: work/final.mp4
          if-no-files-found: ignore
      - name: Save history
        run: |
          git config user.name "shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git commit -m "history: $(date -u +%F)" || echo "nothing to commit"
          git push
